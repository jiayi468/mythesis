<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>CLIP + WebGPU 浏览器端 Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: "Segoe UI", Helvetica, Arial, sans-serif;
      background: #fafafa;
      color: #333;
      margin: 0;
      padding: 2rem;
      display: flex;
      justify-content: center;
    }
    main {
      max-width: 800px;
      width: 100%;
      background: #fff;
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    h2 { text-align: center; margin-bottom: 1.5rem; }
    input, button {
      font-size: 1rem;
      margin: 0.5rem 0;
      width: 100%;
      padding: 0.6rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
    }
    button {
      background-color: #0078d4;
      color: #fff;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }
    button:hover { background-color: #005ea2; }
    #result { margin-top: 1rem; font-size: 1.1rem; text-align: center; color: #444; }
  </style>
</head>

<body>
<main>
  <h2>纯浏览器端 CLIP + WebGPU 演示</h2>
  <input type="file" id="imageInput" accept="image/*">
  <input type="text" id="textInput" placeholder="请输入缺陷描述，如“表面划痕”">
  <button id="runButton">开始匹配</button>
  <div id="result"></div>
</main>

<script type="module">
import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.4.0/dist/transformers.min.js';

const runButton = document.getElementById("runButton");
const resultDiv = document.getElementById("result");

// 将 File 转换为 HTMLImageElement
function fileToImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

// 向量归一化
function normalize(vec) {
  let sumSq = 0;
  for (let i = 0; i < vec.length; i++) sumSq += vec[i]*vec[i];
  const norm = Math.sqrt(sumSq);
  return vec.map(x => x / norm);
}

runButton.onclick = async () => {
  const imageFile = document.getElementById("imageInput").files[0];
  const textInput = document.getElementById("textInput").value.trim();

  if (!imageFile || !textInput) {
    resultDiv.textContent = "⚠️ 请同时选择图片并输入描述文字。";
    return;
  }

  resultDiv.textContent = "⏳ 正在加载 CLIP 模型（首次可能较慢）...";

  // 使用 pipeline + WebGPU
  const clip = await pipeline("feature-extraction", "Xenova/clip-vit-base-patch32", { device: "webgpu" });

  resultDiv.textContent = "🚀 模型加载完成，正在提取图像与文本特征...";

  // 转换图片文件为 HTMLImageElement
  const imgElement = await fileToImage(imageFile);

  // 使用 pipeline 提取图像和文本特征
  const [imgOut, txtOut] = await Promise.all([
    clip(imgElement, { pooling: "mean", normalize: true }),
    clip(textInput, { pooling: "mean", normalize: true })
  ]);

  // 取第一个特征向量
  const imgVec = imgOut[0].data;
  const txtVec = txtOut[0].data;

  // 归一化
  const imgNorm = normalize(imgVec);
  const txtNorm = normalize(txtVec);

  // 计算余弦相似度
  let dot = 0;
  for (let i = 0; i < imgNorm.length; i++) dot += imgNorm[i] * txtNorm[i];

  resultDiv.textContent = `✅ 相似度：${dot.toFixed(4)}`;
};
</script>
</body>
</html>

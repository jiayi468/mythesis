[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clip-anomaly-midterm"
version = "0.1.0"
description = "CPU-first CLIP Patch anomaly detection baseline for midterm evidence"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23,<2",
  "Pillow>=9",
  "PyYAML>=6",
  "scikit-learn>=1.1",
  "matplotlib>=3.5",
  "torch>=1.13",
  "torchvision>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
model = ["open_clip_torch==2.24.0"]
onnx = ["onnx==1.14.1", "onnxruntime==1.19.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
